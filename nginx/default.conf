server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Old cs.ksu.edu/~russfeld URLs, if someone swaps only the host.
    rewrite ^/~russfeld/?(.*)$ /$1 permanent;

    # The CV now lives on the main site.
    rewrite ^/cv\.(?:php|html)$ https://russfeld.me/about/cv/ permanent;

    # Pages were pre-rendered from PHP to HTML.
    rewrite ^(.*)\.php$ $1.html permanent;

    location / {
        try_files $uri $uri/ =404;
    }
}
